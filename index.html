<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Chocolate Quality Tracker</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#fbf7f2;color:#3d2b1f;
  }
  .card{
    background:#fff;border:1px solid #ece1d6;border-radius:14px;box-shadow:0 2px 10px rgba(61,43,31,0.06);
    padding:32px;max-width:360px;width:100%;text-align:center;
  }
  h1{font-size:19px;margin:0 0 6px;}
  p{color:#8a7867;font-size:14px;margin:0 0 22px;}
  #gsiButton{display:flex;justify-content:center;}
  #err{color:#b6423f;font-size:13px;margin-top:14px;}
</style>
</head>
<body>
  <div class="card">
    <h1>Chocolate Quality Tracker</h1>
    <p>Sign in with Google to continue.</p>
    <div id="gsiButton"></div>
    <div id="err" class="hidden" style="display:none;"></div>
  </div>

<script>
/* =========================================================
   CONFIG — fill these in after you have both URLs.
========================================================= */
// The OAuth Client ID from Google Cloud Console. Must be the SAME
// value used in APPS_SCRIPT_URL's Code.gs (CONFIG.GOOGLE_CLIENT_ID).
const GOOGLE_CLIENT_ID = "167756359063-72sktnlvmhacm43hsgc49p8mhpnebnl4.apps.googleusercontent.com";

// Your deployed Apps Script web app URL, e.g.
// "https://script.google.com/macros/s/AKfycb.../exec"
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxgXpmLCyPnRVlXnYlKMpm2vDaTE6Gr_XO-7meqcftsZ2P_1XQQErB6BihYE-mMBKHu/exec";

window.onload = function () {
  if (!window.google || !google.accounts) {
    document.getElementById("err").style.display = "block";
    document.getElementById("err").textContent = "Google sign-in failed to load. Check your connection and reload.";
    return;
  }
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse
  });
  google.accounts.id.renderButton(document.getElementById("gsiButton"), { theme: "outline", size: "large", shape: "pill" });
};

function handleCredentialResponse(response) {
  if (!response || !response.credential) {
    document.getElementById("err").style.display = "block";
    document.getElementById("err").textContent = "Sign-in did not return a token. Please try again.";
    return;
  }
  const target = APPS_SCRIPT_URL + "?token=" + encodeURIComponent(response.credential);
  window.location.href = target;
}
</script>
</body>
</html>
