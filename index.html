<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>SCR Drinking Water Sample Collection</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6efe0;
    --card:#fffbf4;
    --ink:#2b1a12;
    --ink-soft:#6b5546;
    --ink-faint:#9c8a78;
    --line:#e1d3ba;
    --line-strong:#cbb896;
    --caramel:#b06a2c;
    --bad:#a1403a;
    --bad-bg:#f7e8e5;
    --bad-border:#e7bfb8;
    --serif:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:var(--sans);
    background:var(--paper);
    background-image:repeating-linear-gradient(0deg, rgba(43,26,18,0.028) 0px, rgba(43,26,18,0.028) 1px, transparent 1px, transparent 28px);
    color:var(--ink);
    padding:20px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:3px;
    padding:36px 30px;
    max-width:360px;
    width:100%;
    text-align:center;
    position:relative;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:var(--caramel);border-radius:3px 3px 0 0;
  }
  
  /* NEW: Style specifically for your image inside the card */
  .card-img {
    max-width: 100%;       /* Keeps it responsive on all mobile screens */
    height: auto;          /* Maintains the aspect ratio so it doesn't stretch */
    display: block;
    margin: 0 auto 20px;   /* Centers the image and adds space below it */
    border-radius: 4px;    /* Soft corners to match your card layout */
    border: 1px solid var(--line); /* Uses your custom border color variable */
  }

  .kicker{font-size:11px;letter-spacing:0.02em;color:var(--ink-faint);margin-bottom:6px;}
  h1{font-family:var(--serif);font-weight:600;font-size:21px;margin:0 0 8px;}
  p.sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 26px;}
  #gsiButton{display:flex;justify-content:center;min-height:40px;}
  #err{
    color:var(--bad);background:var(--bad-bg);border:1.5px solid var(--bad-border);
    border-radius:6px;font-size:13px;margin-top:16px;padding:10px 12px;font-weight:600;
    display:none;text-align:left;
  }

  /* The app itself: a full-screen frame that replaces the card once it has loaded. */
  #appFrame{
    display:none;position:fixed;top:0;left:0;width:100%;height:100%;
    border:0;background:var(--paper);
  }
  body.app-mode{padding:0;display:block;background:var(--paper);background-image:none;}
  body.app-mode #appFrame{display:block;}
  body.app-mode .card{display:none;}
  /* Between the sign-in click and the app appearing: keep the card, hide the Google button. */
  body.loading #gsiButton{display:none;}
</style>
</head>
<body>
  <div class="card">
    <img src="logo.png" alt="Logo" class="card-img">
    <div class="kicker">Samples Collection log</div>
    <h1>SCR Drinking Water Sample Collection</h1>
    <p class="sub" id="subText">Sign in with your Google account to continue.</p>
    <div id="gsiButton"></div>
    <div id="err"></div>
  </div>

  <!-- The Apps Script app opens in here, so its address and Google's
       "created by a Google Apps Script user" banner are never shown. -->
  <iframe id="appFrame" name="appFrame" title="Quality Tracker"></iframe>

<script>
/* =========================================================
   CONFIG — fill these in after you have both URLs.
========================================================= */
// The OAuth Client ID from Google Cloud Console. Must be the SAME
// value as CONFIG.GOOGLE_CLIENT_ID in Code.gs.
// Also add THIS page's origin (e.g. https://quality-tracker.netlify.app)
// under "Authorized JavaScript origins" for that client.
const GOOGLE_CLIENT_ID = "167756359063-72sktnlvmhacm43hsgc49p8mhpnebnl4.apps.googleusercontent.com";

// Your deployed Apps Script web app URL, e.g.
// "https://script.google.com/macros/s/AKfycb.../exec"
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxgXpmLCyPnRVlXnYlKMpm2vDaTE6Gr_XO-7meqcftsZ2P_1XQQErB6BihYE-mMBKHu/exec";

function showErr(message) {
  const el = document.getElementById("err");
  el.textContent = message;
  el.style.display = "block";
}

window.onload = function () {
  if (!GOOGLE_CLIENT_ID || !APPS_SCRIPT_URL) {
    showErr("This page isn't configured yet — GOOGLE_CLIENT_ID and APPS_SCRIPT_URL need to be filled in.");
    return;
  }
  if (!window.google || !google.accounts) {
    showErr("Google sign-in failed to load. Check your connection and reload.");
    return;
  }
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse,
    auto_select: false
  });
  google.accounts.id.disableAutoSelect(); // after "Sign out", don't silently sign the same account straight back in
  google.accounts.id.renderButton(document.getElementById("gsiButton"), { theme: "outline", size: "large", shape: "pill" });
};

function handleCredentialResponse(response) {
  if (!response || !response.credential) {
    showErr("Sign-in did not return a token. Please try again.");
    return;
  }

  document.getElementById("err").style.display = "none";
  document.getElementById("subText").textContent = "Signing you in…";
  document.body.classList.add("loading");

  const frame = document.getElementById("appFrame");
  let shown = false;
  const showApp = function () {
    if (shown) return;
    shown = true;
    document.body.classList.remove("loading");
    document.body.classList.add("app-mode");
  };
  // First load event after the POST below = the app has arrived.
  frame.addEventListener("load", showApp, { once: true });
  setTimeout(showApp, 15000);   // safety net on a very slow connection

  // POST the token into the iframe instead of putting it in a URL: it never lands in the
  // address bar, browser history or a copied link. (Needs doPost in Code.gs.)
  const form = document.createElement("form");
  form.method = "POST";
  form.action = APPS_SCRIPT_URL;
  form.target = "appFrame";
  const input = document.createElement("input");
  input.type = "hidden";
  input.name = "token";
  input.value = response.credential;
  form.appendChild(input);
  document.body.appendChild(form);
  form.submit();
  document.body.removeChild(form);
}
</script>
</body>
</html>
