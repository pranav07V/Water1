<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Chocolate Quality Tracker</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6efe0;
    --card:#fffbf4;
    --ink:#2b1a12;
    --ink-soft:#6b5546;
    --ink-faint:#9c8a78;
    --line:#e1d3ba;
    --line-strong:#cbb896;
    --caramel:#b06a2c;
    --bad:#a1403a;
    --bad-bg:#f7e8e5;
    --bad-border:#e7bfb8;
    --serif:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:var(--sans);
    background:var(--paper);
    background-image:repeating-linear-gradient(0deg, rgba(43,26,18,0.028) 0px, rgba(43,26,18,0.028) 1px, transparent 1px, transparent 28px);
    color:var(--ink);
    padding:20px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:3px;
    padding:36px 30px;
    max-width:360px;
    width:100%;
    text-align:center;
    position:relative;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:var(--caramel);border-radius:3px 3px 0 0;
  }
  .kicker{font-size:11px;letter-spacing:0.02em;color:var(--ink-faint);margin-bottom:6px;}
  h1{font-family:var(--serif);font-weight:600;font-size:21px;margin:0 0 8px;}
  p.sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 26px;}
  #gsiButton{display:flex;justify-content:center;min-height:40px;}
  #err{
    color:var(--bad);background:var(--bad-bg);border:1.5px solid var(--bad-border);
    border-radius:6px;font-size:13px;margin-top:16px;padding:10px 12px;font-weight:600;
    display:none;text-align:left;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="kicker">Quality control log</div>
    <h1>Chocolate Quality Tracker</h1>
    <p class="sub">Sign in with your Google account to continue.</p>
    <div id="gsiButton"></div>
    <div id="err"></div>
  </div>

<script>
/* =========================================================
   CONFIG — fill these in after you have both URLs.
========================================================= */
// The OAuth Client ID from Google Cloud Console. Must be the SAME
// value used in APPS_SCRIPT_URL's Code.gs (CONFIG.GOOGLE_CLIENT_ID).
const GOOGLE_CLIENT_ID = "167756359063-72sktnlvmhacm43hsgc49p8mhpnebnl4.apps.googleusercontent.com";

// Your deployed Apps Script web app URL, e.g.
// "https://script.google.com/macros/s/AKfycb.../exec"
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxgXpmLCyPnRVlXnYlKMpm2vDaTE6Gr_XO-7meqcftsZ2P_1XQQErB6BihYE-mMBKHu/exec";

function showErr(message) {
  const el = document.getElementById("err");
  el.textContent = message;
  el.style.display = "block";
}

window.onload = function () {
  if (!GOOGLE_CLIENT_ID || !APPS_SCRIPT_URL) {
    showErr("This page isn't configured yet — GOOGLE_CLIENT_ID and APPS_SCRIPT_URL need to be filled in.");
    return;
  }
  if (!window.google || !google.accounts) {
    showErr("Google sign-in failed to load. Check your connection and reload.");
    return;
  }
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse
  });
  google.accounts.id.renderButton(document.getElementById("gsiButton"), { theme: "outline", size: "large", shape: "pill" });
};

function handleCredentialResponse(response) {
  if (!response || !response.credential) {
    showErr("Sign-in did not return a token. Please try again.");
    return;
  }
  const target = APPS_SCRIPT_URL + "?token=" + encodeURIComponent(response.credential);
  window.location.href = target;
}
</script>
</body>
</html>
